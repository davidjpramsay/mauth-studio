<svg
  xmlns="http://www.w3.org/2000/svg"
  width="993"
  height="1404"
  viewBox="0 0 993 1404"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Function transformations mathematics notes</title>
  <desc id="desc">
    A full page of mathematics notes containing transformation rules, a labelled graph, a parameter table, a worked
    example, a sketching checklist, and common mistakes.
  </desc>
  <defs>
    <linearGradient id="notes-crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1887f2" />
      <stop offset="1" stop-color="#4f46d8" />
    </linearGradient>
  </defs>

  <rect width="993" height="1404" fill="#ffffff" />
  <rect x="1" y="1" width="991" height="1402" fill="none" stroke="#dce4ef" stroke-width="2" />

  <g transform="translate(58 42)">
    <path d="M0 0 H82 V63 C82 91 63 111 41 121 C19 111 0 91 0 63 Z" fill="url(#notes-crest)" />
    <path d="M13 14 H69 V59 C69 78 58 93 41 102 C24 93 13 78 13 59 Z" fill="none" stroke="#ffffff" stroke-width="3" />
    <path d="M22 69 C37 54 51 49 67 48 M22 82 C38 67 52 63 68 61" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="4" />
    <path d="M29 28 V87" stroke="#ffffff" stroke-linecap="round" stroke-width="4" />
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="165" y="68" fill="#52627a" font-size="16" font-weight="750">RIVERGUM COLLEGE</text>
    <text x="165" y="108" fill="#172133" font-size="34" font-weight="820">FUNCTION TRANSFORMATIONS</text>
    <text x="165" y="140" fill="#52627a" font-size="17" font-weight="650">YEAR 11 MATHEMATICAL METHODS</text>
    <text x="932" y="108" fill="#246fd2" font-size="17" font-weight="800" text-anchor="end">SUMMARY NOTES</text>
  </g>
  <line x1="58" y1="178" x2="935" y2="178" stroke="#246fd2" stroke-width="4" />

  <g font-family="Inter, Arial, sans-serif">
    <text x="60" y="226" fill="#172133" font-size="24" font-weight="820">1. The transformation rule</text>
    <rect x="60" y="248" width="873" height="118" rx="10" fill="#f4f8fe" stroke="#d6e3f4" stroke-width="2" />
    <text x="496.5" y="302" fill="#172133" font-family="Georgia, 'Times New Roman', serif" font-size="32" text-anchor="middle">
      g(x) = a f(b(x - h)) + k
    </text>
    <text x="496.5" y="339" fill="#4b5c73" font-size="17" text-anchor="middle">
      A point (x, y) on y = f(x) maps to (x/b + h, ay + k) on y = g(x), where b is not zero.
    </text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="397" width="516" height="398" rx="10" fill="#ffffff" stroke="#d8e0eb" stroke-width="2" />
    <text x="88" y="439" fill="#172133" font-size="20" font-weight="800">Parent and transformed graphs</text>

    <g fill="none" stroke="#e0e6ef" stroke-width="1">
      <path d="M100 484 H548 M100 516 H548 M100 548 H548 M100 580 H548 M100 612 H548 M100 644 H548 M100 676 H548 M100 708 H548 M100 740 H548" />
      <path d="M100 468 V752 M144 468 V752 M188 468 V752 M232 468 V752 M276 468 V752 M320 468 V752 M364 468 V752 M408 468 V752 M452 468 V752 M496 468 V752 M540 468 V752" />
    </g>
    <g fill="none" stroke="#172133" stroke-linecap="round" stroke-width="2">
      <line x1="100" y1="612" x2="550" y2="612" />
      <line x1="276" y1="752" x2="276" y2="464" />
    </g>
    <path
      d="M184 471 C203 520 222 566 254 601 C265 609 271 612 276 612 C281 612 287 609 298 601 C330 566 349 520 368 471"
      fill="none"
      stroke="#7b8798"
      stroke-linecap="round"
      stroke-width="3"
    />
    <path
      d="M232 500 C261 559 291 609 320 628 C338 640 352 644 364 644 C376 644 390 640 408 628 C437 609 467 559 496 500"
      fill="none"
      stroke="#246fd2"
      stroke-linecap="round"
      stroke-width="5"
    />
    <line x1="364" y1="476" x2="364" y2="744" stroke="#246fd2" stroke-dasharray="7 6" stroke-width="2" />
    <circle cx="364" cy="644" r="6" fill="#246fd2" />
    <g fill="#536176" font-size="14">
      <text x="535" y="600">x</text>
      <text x="286" y="478">y</text>
      <text x="286" y="633">0</text>
      <text x="355" y="633">2</text>
      <text x="208" y="497">y = x&#178;</text>
      <text x="391" y="525" fill="#185fc1" font-weight="750">y = 0.5(x - 2)&#178; - 1</text>
      <text x="375" y="670" fill="#185fc1">vertex (2, -1)</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="598" y="397" width="335" height="398" rx="10" fill="#f8fafc" stroke="#d8e0eb" stroke-width="2" />
    <text x="625" y="439" fill="#172133" font-size="20" font-weight="800">What each parameter does</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" text-anchor="middle">
      <circle cx="644" cy="496" r="24" fill="#e7f0ff" />
      <text x="644" y="504" fill="#185fc1">a</text>
      <circle cx="644" cy="575" r="24" fill="#e9f7f4" />
      <text x="644" y="583" fill="#107965">b</text>
      <circle cx="644" cy="654" r="24" fill="#f0edff" />
      <text x="644" y="662" fill="#5b3fc4">h</text>
      <circle cx="644" cy="733" r="24" fill="#fff1e7" />
      <text x="644" y="741" fill="#b6531f">k</text>
    </g>
    <g fill="#3f4b5d" font-size="16">
      <text x="685" y="485" font-weight="750">Vertical scale |a|</text>
      <text x="685" y="510">Reflect in x-axis if a &lt; 0.</text>
      <text x="685" y="564" font-weight="750">Horizontal scale 1/|b|</text>
      <text x="685" y="589">Reflect in y-axis if b &lt; 0.</text>
      <text x="685" y="643" font-weight="750">Horizontal translation</text>
      <text x="685" y="668">Move h units right.</text>
      <text x="685" y="722" font-weight="750">Vertical translation</text>
      <text x="685" y="747">Move k units up.</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="60" y="850" fill="#172133" font-size="24" font-weight="820">2. Worked example</text>
    <rect x="60" y="872" width="873" height="250" rx="10" fill="#f7f9fc" stroke="#d8e0eb" stroke-width="2" />
    <rect x="60" y="872" width="8" height="250" rx="4" fill="#6d4be8" />
    <text x="92" y="921" fill="#172133" font-size="18" font-weight="750">Describe the key features of</text>
    <text x="325" y="921" fill="#5b3fc4" font-family="Georgia, 'Times New Roman', serif" font-size="25">
      g(x) = -2(x - 3)&#178; + 4.
    </text>
    <line x1="92" y1="951" x2="901" y2="951" stroke="#d8e0eb" stroke-width="2" />

    <g fill="#3f4b5d" font-size="17">
      <text x="96" y="991" font-weight="750">Vertex</text>
      <text x="246" y="991">(3, 4)</text>
      <text x="96" y="1027" font-weight="750">Axis of symmetry</text>
      <text x="246" y="1027">x = 3</text>
      <text x="96" y="1063" font-weight="750">Shape</text>
      <text x="246" y="1063">Opens downward; vertical stretch factor 2</text>
    </g>
    <line x1="526" y1="974" x2="526" y2="1092" stroke="#d8e0eb" stroke-width="2" />
    <g fill="#3f4b5d" font-size="17">
      <text x="557" y="991" font-weight="750">y-intercept</text>
      <text x="711" y="991">g(0) = -14</text>
      <text x="557" y="1027" font-weight="750">x-intercepts</text>
      <text x="711" y="1027">x = 3 &#177; &#8730;2</text>
      <text x="557" y="1063" font-weight="750">Range</text>
      <text x="711" y="1063">y &#8804; 4</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="1152" width="414" height="179" rx="10" fill="#eef5ff" stroke="#d4e3f8" stroke-width="2" />
    <text x="86" y="1192" fill="#172133" font-size="19" font-weight="800">Sketching checklist</text>
    <g fill="#3f4b5d" font-size="15">
      <text x="88" y="1224">1. Identify the parent function.</text>
      <text x="88" y="1252">2. Locate the translated key point.</text>
      <text x="88" y="1280">3. Apply stretches and reflections.</text>
      <text x="88" y="1308">4. Label intercepts and asymptotes.</text>
    </g>

    <rect x="499" y="1152" width="434" height="179" rx="10" fill="#fff7f0" stroke="#f2ddca" stroke-width="2" />
    <text x="525" y="1192" fill="#172133" font-size="19" font-weight="800">Common mistakes</text>
    <g fill="#3f4b5d" font-size="15">
      <text x="527" y="1224">&#8226; Using b instead of 1/|b| for horizontal scale.</text>
      <text x="527" y="1252">&#8226; Moving left when the rule contains (x - h).</text>
      <text x="527" y="1280">&#8226; Forgetting reflections when a or b is negative.</text>
      <text x="527" y="1308">&#8226; Sketching without labelling key features.</text>
    </g>
  </g>

  <text x="60" y="1367" fill="#738096" font-family="Inter, Arial, sans-serif" font-size="14">FUNCTIONS AND MODELLING</text>
  <text x="933" y="1367" fill="#738096" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="end">1</text>
</svg>
