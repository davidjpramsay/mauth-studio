appId: au.edu.acc.mauth-studio
productName: Mauth Studio
copyright: Australian Christian College
directories:
  output: release
files:
  - desktop/**
  - package.json
asar: true
afterSign: scripts/after-sign-macos.cjs
extraFiles:
  - from: tmp/macos/quicklook
    to: PlugIns
extraResources:
  - from: build/mauth-document.icns
    to: mauth-document.icns
  - from: apps/web/dist
    to: web-dist
  - from: configs
    to: configs
  - from: tmp/macos/mauth-api
    to: sidecars/mauth-api
  - from: tmp/macos/penrose-runtime
    to: penrose-runtime
  - from: tmp/macos/mauth-agent
    to: agent
  - from: docs/assets/mauth-icon.png
    to: mauth-icon.png
mac:
  category: public.app-category.education
  icon: docs/assets/mauth-icon.png
  electronUpdaterCompatibility: ">=2.16"
  signIgnore:
    - /Contents/PlugIns/
  extendInfo:
    NSDocumentsFolderUsageDescription: Mauth Studio needs access to the documents folders you choose for assessment files.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Mauth Studio Document
        CFBundleTypeRole: Editor
        CFBundleTypeIconFile: mauth-document.icns
        CFBundleTypeExtensions:
          - mauth
        LSHandlerRank: Owner
        LSItemContentTypes:
          - au.edu.acc.mauth-studio.document
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: au.edu.acc.mauth-studio.document
        UTTypeDescription: Mauth Studio Document
        UTTypeConformsTo:
          - public.json
          - public.data
        UTTypeTagSpecification:
          public.filename-extension:
            - mauth
          public.mime-type: application/vnd.mauth-studio.document+json
  target:
    - target: dir
      arch:
        - arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
artifactName: Mauth-Studio-${version}-${arch}.${ext}
publish:
  provider: github
  owner: davidjpramsay
  repo: mauth-studio
  releaseType: prerelease
