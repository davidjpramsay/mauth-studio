<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Mauth Studio</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #172033;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: min(280px, calc(100vw - 48px));
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.2;
        margin: 0;
      }

      .progress {
        background: #dce3ed;
        height: 2px;
        overflow: hidden;
        position: relative;
        width: 180px;
      }

      .progress::after {
        animation: loading 1.25s ease-in-out infinite;
        background: #1769f4;
        content: "";
        height: 100%;
        left: 0;
        position: absolute;
        transform: translateX(-100%);
        width: 45%;
      }

      p {
        color: #697386;
        font-size: 13px;
        letter-spacing: 0;
        margin: 0;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(325%);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #f1f5f9;
        }

        .progress {
          background: #334155;
        }

        .progress::after {
          background: #4f8cff;
        }

        p {
          color: #9ca9ba;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation-duration: 2.5s;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <h1>Mauth Studio</h1>
      <div class="progress" role="progressbar" aria-label="Starting Mauth Studio"></div>
      <p>Starting...</p>
    </main>
  </body>
</html>
